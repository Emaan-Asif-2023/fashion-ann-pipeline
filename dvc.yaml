stages:
  prepare:
    cmd: python src/prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - data/raw
      - src/preprocess.py
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - data/processed
      - src/train.py
      - params.yaml
    outs:
      - models/model.h5

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - models/model.h5
      - data/processed
      - src/evaluate.py
    metrics:
      - metrics.json